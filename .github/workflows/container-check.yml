name: Container check

# Scans the image we publish, so it only runs when there is one. The weekly
# schedule upstream had is off until this fork has cut its first release --
# a timer that fails every Saturday on "image not found" is not a security
# control. Turn it back on then.
#
# Snyk is gone: it needs SNYK_TOKEN, which belongs to the upstream project.
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload the SARIF report
    steps:
      - uses: actions/checkout@v6

      - name: Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: "ghcr.io/${{ github.repository }}:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          # Findings belong in the Security tab; a failing scan step should mean
          # the scan itself broke.
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
