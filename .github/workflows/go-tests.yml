name: Go tests

on:
  push:
    branches: [ main ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - .github/workflows/go-tests.yml
  pull_request:
    branches: [ main ]
    # You can't use yaml anchors here
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - .github/workflows/go-tests.yml

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # The declared minimum, so the suite is exercised against the version
          # we promise to build with. The vulnerability scan and the release
          # build deliberately use a newer toolchain instead.
          go-version-file: go.mod

      - name: Install go modules
        run: go mod download

      # No cluster here on purpose. tests/helpers.go pins KUBECONFIG to a
      # dead-end kubeconfig on import, and the tests that need an API server
      # skip themselves unless HELMTIDE_TEST_CLUSTER is set. Those run in
      # integration-tests.yml against KinD.
      - name: Run tests
        run: go test -coverprofile=tests.cov -covermode=atomic -timeout=20m ./...

      - name: Coverage
        run: go tool cover -func=tests.cov | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests.cov
          retention-days: 14
