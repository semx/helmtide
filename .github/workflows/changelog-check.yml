name: Changelog check

on:
  pull_request:
    branches: [ main ]

jobs:
  changelog-check:
    runs-on: ubuntu-latest
    # Upstream's dependabot workflow wrote the changie entry for it, using a
    # GitHub App this fork does not have. Rather than fail every dependency
    # bump on a missing changelog, dependency PRs are exempt; changie batch
    # picks the rest up at release time.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - name: "Check for changelog entry"
        uses: brettcannon/check-for-changed-files@v1
        with:
          file-pattern: |
            .changes/unreleased/*.yaml
          failure-message: "Missing any changie unreleased changelogs. Please use `changie new` and document your changes"
