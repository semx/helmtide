name: Goreleaser

# Everything here runs on the token GitHub hands the job. The upstream release
# also logged in to Docker Hub, signed the Homebrew tap and announced to a
# Telegram channel, all with credentials that belong to the helmwave project --
# those publishers are gone from .goreleaser.yml, so nothing here asks for a
# secret we do not have.
on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
      issues: write # to close the milestone
      packages: write # to push to ghcr.io
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # https://github.com/orgs/community/discussions/25678#discussioncomment-5242449
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - uses: actions/setup-go@v6
        with:
          # Not go.mod. go.mod declares the oldest Go we support; released
          # binaries are built with the newest one, which is where the standard
          # library fixes are. See .github/govulncheck-baseline.txt.
          go-version: stable
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --skip=validate --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
