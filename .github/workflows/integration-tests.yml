name: Integration tests

# The integration suite installs, upgrades, rolls back, hooks, monitors,
# post-renders and uninstalls real releases, so it needs a real API server.
# It runs against a throwaway KinD cluster created in the job.
#
# The tests refuse to touch a cluster unless HELMTIDE_TEST_CLUSTER names a
# kubeconfig (tests/helpers.go pins KUBECONFIG to a dead end otherwise), so the
# opt-in is explicit here and nowhere else.
#
# Locally: HELMTIDE_TEST_CLUSTER=~/.kube/config go test -tags=integration ./...
# The OCI tests additionally need registries: HELMTIDE_TEST_OCI_PLAIN=host:port for
# the plain-HTTP one, and HELMTIDE_TEST_OCI_AUTH=host:port with
# HELMTIDE_TEST_OCI_AUTH_USER / HELMTIDE_TEST_OCI_AUTH_PASS for the authenticated one.
on:
  push:
    branches: [ main ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "tests/**"
      - .github/workflows/integration-tests.yml
  pull_request:
    branches: [ main ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "tests/**"
      - .github/workflows/integration-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      # A plain-HTTP OCI registry for the OCI regression test. registry:2 serves
      # HTTP with no TLS, which is exactly what plain_http: true has to talk to.
      # Reachable on localhost from the runner, where the chart push and pull
      # happen; the cluster never touches it.
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v6

      - name: Create KinD cluster
        # Pinned to a commit-tagged release; brings up a single-node cluster and
        # writes its kubeconfig to ~/.kube/config.
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: helmtide-it

      # The suite only talks to a cluster it is handed, so name the KinD
      # kubeconfig explicitly rather than relying on the ambient environment.
      #
      # HELMTIDE_TEST_REMOTE_CHARTS is deliberately left unset: the suites that
      # pull charts from third-party repos (bitnami, prometheus-community, ...)
      # skip here so a hosted CDN outage can never turn this job red. That
      # regression runs on the self-hosted runners against a long-lived cluster,
      # where reaching the public internet is the point.
      - name: Point the suite at KinD
        run: |
          {
            echo "KUBECONFIG=$HOME/.kube/config"
            echo "HELMTIDE_TEST_CLUSTER=$HOME/.kube/config"
            echo "HELMTIDE_TEST_OCI_PLAIN=localhost:5000"
            echo "HELMTIDE_TEST_OCI_AUTH=localhost:5002"
            echo "HELMTIDE_TEST_OCI_AUTH_USER=tide"
            echo "HELMTIDE_TEST_OCI_AUTH_PASS=tidepass"
          } >> "$GITHUB_ENV"

      - name: Start an authenticated OCI registry
        # A second registry, HTTPS with a self-signed certificate and htpasswd
        # auth, so the authenticated-OCI test exercises helmtide's own registry
        # login (pkg/registry Install()), which the plain-HTTP one does not.
        # Reachable only on localhost, where the push and the pull happen.
        run: |
          mkdir -p auth-reg/certs auth-reg/auth
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout auth-reg/certs/tls.key -out auth-reg/certs/tls.crt \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          docker run --rm httpd:2 htpasswd -Bbn tide tidepass > auth-reg/auth/htpasswd
          docker run -d --name helmtide-authreg -p 5002:5000 \
            -v "$PWD/auth-reg/certs:/certs" -v "$PWD/auth-reg/auth:/auth" \
            -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/tls.crt \
            -e REGISTRY_HTTP_TLS_KEY=/certs/tls.key \
            -e REGISTRY_AUTH=htpasswd \
            -e REGISTRY_AUTH_HTPASSWD_REALM=Registry \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:2
          for _ in $(seq 1 20); do
            [ "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:5002/v2/)" = "401" ] && break
            sleep 1
          done

      - name: Check the cluster answers
        run: kubectl cluster-info

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install go modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Run integration tests
        run: go test -tags=integration -covermode=atomic -timeout=30m ./...
