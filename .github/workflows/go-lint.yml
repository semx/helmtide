name: Go lint

on:
  push:
    branches: [ main ]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/go-lint.yml
      - .golangci.yml
  pull_request:
    branches: [ main ]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/go-lint.yml
      - .golangci.yml

permissions:
  contents: read

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned, and tied to the toolchain in go.mod. helm v4 raised that to
          # 1.26, and v2.4 -- built with Go 1.25 -- refuses to load at all
          # against it, so this moved with it. The linters v2.12 adds are
          # accounted for in .golangci.yml rather than left reporting.
          version: v2.12.2
