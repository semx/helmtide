name: JSON Schema

# Built from source instead of by running the published container: the schema
# can then be regenerated for any commit, the binary name is not baked into the
# workflow, and a release does not have to wait for its own image to exist.
on:
  release:
    types: [ published ]
  pull_request:
    branches: [ main ]
    paths:
      - "pkg/plan/**.go"
      - "pkg/release/**.go"
      - "pkg/repo/**.go"
      - "cmd/schema/**"
      - .github/workflows/json-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach schema.json to the release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate schema
        run: go run ./cmd/schema schema > schema.json

      - name: Check it parses
        run: jq empty schema.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema.json
          path: schema.json

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" schema.json --clobber
