version: 2

before:
  hooks:
    - go mod tidy

###
# Builds
###

# The upstream release also pushed a Nix derivation to its NUR repository, a
# Homebrew formula to its tap, images to its Docker Hub account and an
# announcement to its Telegram channel. All four are somebody else's account, so
# they are gone rather than left to fail on a missing token. What is left needs
# nothing but the token GitHub gives the release job.

builds:
  - &bin
    id: "helmtide"
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goamd64:
      # Go can build using different instruction sets - https://github.com/golang/go/wiki/MinimumRequirements#amd64
      # We don't really need this type of optimization (limiting CPUs helmtide can run on) so we use general v1.
      - v1
    goos:
      - linux
      # - windows
      - darwin
    main: ./cmd/helmtide
    ldflags:
      - -s -w -X github.com/semx/helmtide/pkg/version.Version={{ .Version }}

  #  - <<: *bin
  #    main: ./cmd/schema
  #    id: schema
  #    binary: schema

  - <<: *bin
    main: ./cmd/gitops
    id: gitops
    binary: gitops

###
# Packages
###
archives:
  - &archive
    ids: [ helmtide ]
    name_template: >-2
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
      {{- with .Arm }}v{{ . }}{{ end -}}
      {{- with .Mips }}_{{ . }}{{ end -}}
      {{- if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end -}}
    id: helmtide
    formats: [ tar.gz ]
    format_overrides:
      - goos: windows
        formats: [ zip ]

  - <<: *archive
    id: gitops
    ids: [ gitops ]


nfpms:
  - &nfpms
    id: helmtide
    maintainer: community@helmtide.dev
    ids: [ helmtide ]
    formats:
      - apk
      - deb
      - rpm

  - <<: *nfpms
    id: gitops
    package_name: gitops
    ids: [ gitops ]


checksum:
  name_template: "checksums.txt"

dockers:
  # helmtide
  - dockerfile: Dockerfile
    image_templates:
      - ghcr.io/semx/helmtide:{{ .Version }}-scratch-amd64
      - ghcr.io/semx/helmtide:scratch-amd64
    build_flag_templates:
      - "--label=org.opencontainers.image.description=helmtide, a maintained fork of helmwave"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.licenses=MIT"
      - "--label=org.opencontainers.image.source=https://github.com/semx/helmtide"
      - "--label=org.opencontainers.image.url=https://github.com/semx/helmtide/pkgs/container/helmtide"
      - "--label=org.opencontainers.image.documentation=https://helmtide.dev/"

      - "--platform=linux/amd64"
      - "--target=scratch-goreleaser"
      - "--pull"
    goos: linux
    goarch: amd64
    goamd64: v1
    use: buildx
  - dockerfile: Dockerfile
