kind: Fixed
body: >-
    plan export no longer risks deleting the system temp dir or an unsafe
    --plandir: the dangerous os.TempDir() fallback is gone and export now
    validates the symlink-resolved target (rejecting root, top-level, cwd and
    the temp root, defeating symlink and relative-TMPDIR bypasses) and stages
    atomically, always keeping the previous plan recoverable if a new export
    fails partway
